<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Specifications</title>
</head>
<body>

    <h1>Wireless Headphones</h1>

    <h2>Product Specification Table</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th>Specification</th>
            <th>Details</th>
        </tr>

        <tr>
            <td>Product Name</td>
            <td>Wireless Headphones</td>
        </tr>

        <tr>
            <td>Brand</td>
            <td>SoundWave</td>
        </tr>

        <tr>
            <td>Connectivity</td>
            <td>Bluetooth</td>
        </tr>

        <tr>
            <td>Battery Life</td>
            <td>30 Hours</td>
        </tr>

        <tr>
            <td>Colour</td>
            <td>Black</td>
        </tr>

        <tr>
            <td>Price</td>
            <td>Rs. 2499</td>
        </tr>

        <tr>
            <td>Warranty</td>
            <td>1 Year</td>
        </tr>
    </table>

</body>
</html>
